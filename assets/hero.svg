<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Grill Us</title>
  <desc id="desc">An attributed product interview for several humans</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#15162d"/>
      <stop offset="1" stop-color="#24123a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1010 60) rotate(132) scale(460 300)">
      <stop stop-color="#a855f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(190 360) rotate(-38) scale(430 250)">
      <stop stop-color="#22d3ee" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(72 88)">
      <rect x="0" y="0" width="104" height="28" rx="14" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="17" cy="14" r="4" fill="#67e8f9"/>
      <text x="30" y="19" font-size="12" font-weight="700" letter-spacing="1.5" fill="#dff8ff">AGENT SKILL</text>
      <text x="0" y="92" font-size="72" font-weight="750" letter-spacing="-3.5" fill="#fff">Grill Us</text>
      <text x="3" y="137" font-size="21" fill="#cbd5e1">Product decisions with speaker provenance.</text>
      <g transform="translate(3 181)" font-size="13" font-weight="600">
        <rect width="112" height="34" rx="17" fill="#22d3ee" fill-opacity=".13" stroke="#67e8f9" stroke-opacity=".28"/>
        <text x="20" y="22" fill="#a5f3fc">WHO KNOWS</text>
        <rect x="124" width="116" height="34" rx="17" fill="#a855f7" fill-opacity=".14" stroke="#c084fc" stroke-opacity=".28"/>
        <text x="144" y="22" fill="#e9d5ff">WHO DECIDES</text>
        <rect x="252" width="132" height="34" rx="17" fill="#fb7185" fill-opacity=".13" stroke="#fda4af" stroke-opacity=".27"/>
        <text x="272" y="22" fill="#fecdd3">WHO DISAGREES</text>
      </g>
    </g>

    <g transform="translate(742 55)">
      <path d="M42 0h389a24 24 0 0 1 24 24v52a24 24 0 0 1-24 24H70L42 122v-22H24A24 24 0 0 1 0 76V24A24 24 0 0 1 24 0z" fill="#fff" fill-opacity=".095" stroke="#fff" stroke-opacity=".15"/>
      <circle cx="34" cy="31" r="12" fill="#22d3ee"/>
      <text x="56" y="35" font-size="14" font-weight="700" fill="#a5f3fc">MIRA · firsthand observation</text>
      <text x="34" y="68" font-size="16" fill="#f8fafc">Parents ask for progress updates every Friday.</text>
    </g>

    <g transform="translate(788 168)">
      <path d="M24 0h408a24 24 0 0 1 24 24v57a24 24 0 0 1-24 24h-18v22l-28-22H24A24 24 0 0 1 0 81V24A24 24 0 0 1 24 0z" fill="#fff" fill-opacity=".095" stroke="#fff" stroke-opacity=".15"/>
      <circle cx="34" cy="32" r="12" fill="#a855f7"/>
      <text x="56" y="36" font-size="14" font-weight="700" fill="#e9d5ff">DIMA · technical decision</text>
      <text x="34" y="70" font-size="16" fill="#f8fafc">Start with a manual digest before integration.</text>
    </g>

    <g transform="translate(696 289)">
      <rect width="480" height="58" rx="18" fill="#0f172a" fill-opacity=".8" stroke="#67e8f9" stroke-opacity=".35"/>
      <text x="25" y="36" font-size="15" font-weight="650" fill="#dff8ff">AGENT → What evidence would change this decision?</text>
    </g>
  </g>
</svg>
