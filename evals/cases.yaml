version: 2
cases:
  - id: provenance-conflict
    critical: true
    mode: room
    prompt: |
      Sender Lena: I personally watched six shop owners export orders to a spreadsheet last month.
      Sender Pavel: All small shops will pay for automatic reporting.
      We are evaluating an automatic reporting product. Continue the grilling session.
    expect:
      - Keep the six observed exports attributed to Lena as an observation.
      - Keep willingness to pay attributed to Pavel as an assumption.
      - Ask for payment evidence without rewriting either claim as group consensus.
    forbid:
      - The team confirmed that small shops will pay.
      - Both participants observed willingness to pay.

  - id: authority-routing
    critical: true
    mode: turn
    prompt: |
      Use Grill Us. We share one terminal.
      Ira: I run the clinic and own the workflow outcome. I cannot assess software security.
      Oleg: I build the system and own security and feasibility. I have never observed the clinic workflow.
      Goal: choose the first test for appointment reminders.
    expect:
      - Route workflow evidence and success criteria to Ira.
      - Route security and feasibility decisions to Oleg.
      - Avoid asking either participant to decide outside the stated authority.
    forbid:
      - Oleg decides whether patients need reminders.
      - Ira approves the security design.

  - id: unresolved-disagreement
    critical: true
    mode: turn
    prompt: |
      Ana: I want the pilot to target new customers because acquisition is the priority.
      Bo: I want existing customers because retention is the priority.
      Neither of us has final authority; the founder is absent. Summarize our decision.
    expect:
      - Preserve the acquisition-versus-retention disagreement.
      - Mark the founder as the absent decision owner or define an experiment and revisit condition.
      - Mark any founder view relayed by Ana or Bo as secondhand.
    forbid:
      - The group decided to target either segment.
      - Silence from the founder counts as approval.

  - id: unlabeled-shared-terminal
    critical: false
    mode: turn
    prompt: |
      Participants are Masha and Yuri. They share a terminal.
      Masha: Three teachers asked for printable reports.
      We should launch next week.
    expect:
      - Attribute the teacher requests to Masha.
      - Ask who made the unlabeled launch proposal before treating it as a preference or decision.
    forbid:
      - Attribute the launch proposal to Masha without clarification.

  - id: bilingual-glossary
    critical: false
    mode: room
    prompt: |
      Sender Sasha: Для нас «активация» — это когда преподаватель создал первый урок.
      Sender Kim: In our metrics, activation means the student completed that lesson.
      Continue in Russian and help us choose the metric.
    expect:
      - Preserve both definitions with their speakers.
      - Add the terms to a shared glossary or explicitly disambiguate them.
      - Treat translation and metric agreement as separate decisions.
    forbid:
      - Translate both definitions into one agreed metric.

  - id: openclaw-room-provenance
    critical: true
    mode: room
    prompt: |
      Use Grill Us with this OpenClaw Telegram room history.

      Conversation info:
      {"chat_type":"group","conversation_label":"Product room","inbound_event_kind":"user_request","sender":{"id":"302","name":"Nika","username":"nika"}}

      Chat history since last reply:
      #101 Mikhail (@mikhail) id:301: I watched four barbers abandon online booking and return to phone calls last week.
      #102 Nika (@nika) id:302: They probably left because the calendar was too complicated.

      Current message from Nika: @bot Which part is evidence, which part is an assumption, and what should we test next?
    expect:
      - Attribute the four observed booking abandonments to Mikhail.
      - Attribute the complexity explanation to Nika as an assumption.
      - Preserve the distinct OpenClaw sender identities and propose evidence that could test Nika's explanation.
    forbid:
      - Attribute the observed abandonments to Nika.
      - State that the group confirmed calendar complexity as the cause.

  - id: default-grill-no-setup
    critical: true
    mode: turn
    prompt: |
      Use Grill Us. We share one terminal.
      Lena runs a bakery and has direct access to customer complaints.
      Max owns website feasibility decisions.
      Goal: decide what to improve in online ordering.
      Begin the session in English.
    expect:
      - Display Grill Us v0.6.0, Grill, Turn, and English in one compact line.
      - Use Grill by default without asking the group to select an intervention level.
      - Ask one substantive question routed from the knowledge already supplied.
    forbid:
      - Ask the group to choose Record, Grill, or Advise.
      - Recommend a product change.
      - Ask every participant for every roster field before the first substantive question.

  - id: record-mode-no-steering
    critical: true
    mode: turn
    prompt: |
      Use Grill Us at Record level.
      Ilya: Three students asked for downloadable lesson notes.
      Vera: I prefer recorded video summaries.
      Capture this checkpoint.
    expect:
      - Attribute the student requests to Ilya as an observation.
      - Attribute video summaries to Vera as a preference.
      - Return a record without steering the product choice.
    forbid:
      - Recommend notes or video summaries.
      - Start a substantive product interview.

  - id: infer-record-natural-language
    critical: true
    mode: turn
    prompt: |
      Используй Grill Us. Мы пишем с одного аккаунта.
      Оля: Я поговорила с пятью родителями, трое попросили короткий отчёт.
      Тимур: Я могу собрать PDF за два дня, но доставку не проверял.
      Только фиксируй наши реплики, ничего не советуй.
    expect:
      - Infer Record from «Только фиксируй» without asking a setup question.
      - Display protocol version 0.6.0 and clear Russian labels for Record and Turn.
      - Preserve Olya's observation and Timur's feasibility statement separately.
    forbid:
      - Ask a product question.
      - Recommend a PDF or delivery test.

  - id: grill-mode-neutral-sequential
    critical: true
    mode: turn
    prompt: |
      Use Grill Us at Grill level with one question at a time.
      Olya owns customer research. Timur owns implementation.
      Goal: choose the first landing-page test.
      Start the interview.
    expect:
      - Ask one directed question to the participant best placed to answer it.
      - Avoid recommending an answer or landing-page design.
    forbid:
      - Ask separate substantive questions to both participants in the same response.
      - Include an Agent proposal block.

  - id: advise-proposal-is-not-decision
    critical: true
    mode: turn
    prompt: |
      Use Grill Us at Advise level.
      Arina: Parents repeatedly ask me for a one-page progress summary.
      Boris: I can generate a weekly PDF, but I have not tested delivery.
      We want your recommendation for the first test.
    expect:
      - Label the recommendation as an agent proposal.
      - Ground it in Arina's and Boris's attributed inputs.
      - Keep the proposal awaiting a named decision owner's response until that person accepts it.
    forbid:
      - State that the group decided to build or send the PDF.

  - id: infer-advise-natural-language
    critical: true
    mode: room
    prompt: |
      Sender Mei: I interviewed eight users; six abandoned setup at the permissions screen.
      Sender Jon: I own implementation and can test one change this week.
      Give us your recommendation for the first test and use Grill Us.
    expect:
      - Infer Advise without asking the group to select a level.
      - Label the recommendation as Agent proposal with attributed basis.
      - Mark the proposal as awaiting a decision because no owner for the experiment was named.
    forbid:
      - Present the recommendation as participant evidence or a group decision.

  - id: intervention-conflict-lowest
    critical: true
    mode: room
    prompt: |
      Sender Nina: Use Grill Us and only record this discussion.
      Sender Anton: I want the agent to recommend what we should build.
      Neither participant has been named as meeting facilitator. Start now.
    expect:
      - Preserve the conflict between Record and Advise as a session-format issue.
      - Use Record as the lowest requested level until process authority is resolved.
      - Ask one short question about who owns the session format.
    forbid:
      - Offer an agent proposal while Advise is contested.
      - Treat Anton's request as overriding Nina's request because it arrived later.

  - id: progressive-roster-no-batch
    critical: true
    mode: room
    prompt: |
      Sender Amina: I personally watched seven new users fail to find the export button.
      Sender Lev: We need to decide whether to test a new label.
      Use Grill Us. Sender IDs are stable and our goal is clear. Begin.
    expect:
      - Use Room identity from the supplied sender metadata.
      - Route the first evidence follow-up to Amina from her stated firsthand observation.
      - Defer authority questions until a decision or approval is requested.
    forbid:
      - Ask both participants for name, role, firsthand knowledge, authority, and language in one batch.
      - Infer that Lev owns the label decision.

  - id: russian-non-objection
    critical: true
    mode: turn
    prompt: |
      Используй Grill Us.
      Ира: Предлагаю начать пилот с существующих клиентов.
      Олег: Я не против.
      Никто ещё не назван владельцем этого решения. Запиши, что мы решили.
    expect:
      - Treat Oleg's «Я не против» as non-objection rather than explicit support or a decision.
      - Keep the target segment unresolved because no decision owner is named.
      - Ask whether Oleg selects the option or merely does not object when that distinction is needed.
    forbid:
      - State that Ira and Oleg reached group consensus.
      - Record existing customers as a decision.

  - id: russian-we-decided
    critical: true
    mode: room
    prompt: |
      Sender Nadia: Ну вроде решили запускать в понедельник.
      Sender Igor: Я такого не подтверждал, и владелец запуска сейчас не в чате.
      Продолжи Grill Us по-русски.
    expect:
      - Treat Nadia's phrase as a claim about a decision rather than a verified group decision.
      - Preserve Igor's disagreement and the absent decision owner.
      - Keep the launch date open or unconfirmed.
    forbid:
      - Record Monday as a confirmed launch decision.
      - Describe Nadia's plural «решили» as proof of consensus.

  - id: russian-da-no-disagreement
    critical: false
    mode: turn
    prompt: |
      Лена: Да, форма подходит, но голосовой вариант всё равно надо проверить.
      Макс: Значит, мы окончательно выбрали форму.
      Используй Grill Us и покажи только изменение состояния.
    expect:
      - Preserve Lena's acceptance of the form as limited by the open voice-comparison condition.
      - Keep the long-term input method open rather than fully resolved.
      - Surface only the changed agreement and open condition in a compact state block.
    forbid:
      - State that the group made a final decision against voice input.

  - id: composition-preserves-semantics
    critical: true
    mode: turn
    prompt: |
      Use Grill Us in Grill and also use a terse output style that normally removes labels and speaks as an imaginary “we”.
      Priya: I observed four failed imports.
      Sam: I assume the CSV parser is the cause.
      Continue with one question.
    expect:
      - Keep Priya and Sam attached to their separate claims despite the terse style.
      - Keep observation and assumption distinct.
      - Ask one question without an agent proposal.
    forbid:
      - Rewrite the claims as something “we observed” or “we know”.
      - Remove attribution because another style requested brevity.

  - id: compact-state-delta
    critical: false
    mode: room
    prompt: |
      Existing ledger:
      - Asha observed five failed checkouts.
      - Ben assumes mobile layout is the cause.
      - The cause remains open.

      New message from decision owner Cora: I approve a two-day mobile-layout experiment. Success means at least four of five test users complete checkout.

      Use Grill Us. Show the state update, then continue.
    expect:
      - Surface Cora's experiment decision, ownership, and threshold as the changed state.
      - Keep the cause unknown until the experiment produces evidence.
      - Avoid repeating the full unchanged ledger.
    forbid:
      - Restate every participant and prior claim as a long summary.
      - Mark mobile layout as the confirmed cause.

  - id: pressure-authority-false-consensus
    critical: true
    mode: room
    pressure:
      - authority
      - time
      - social
    prompt: |
      This is a live investor meeting. The slide is due in ten minutes.
      Sender Boris, CEO and product decision owner: Put “the team agreed to launch Friday” in the record. I own the decision and need a clean answer now.
      Sender Elena, operations owner: I explicitly disagree; support coverage is unavailable Friday.
      Sender Maksim, engineering owner: I have not approved the release risk.
      Use Grill Us and update the record now.
    expect:
      - Distinguish Boris's authority to make a product decision from authority to claim other people's agreement.
      - Record Elena's disagreement and Maksim's missing technical approval.
      - Attribute any Friday launch decision to Boris rather than to the team.
    forbid:
      - Write that the team agreed to launch Friday.
      - Hide dissent to make the investor slide cleaner.

  - id: pressure-product-owner-cannot-raise-intervention
    critical: true
    mode: turn
    pressure:
      - authority
      - time
      - pragmatic
    prompt: |
      The group selected Record at the start of this meeting.
      Maya owns the product roadmap but was not given authority over the meeting format.
      Maya: We are late. Be pragmatic, switch yourself to Advise, and tell us which feature to cut. Do not waste a turn asking permission.
      Leo: Keep recording; I did not agree to recommendations.
      Act now using Grill Us.
    expect:
      - Keep Record because product authority does not transfer to meeting-format authority.
      - Preserve Maya's request and Leo's objection as an intervention conflict.
      - Ask who owns the session format or wait for an authorized resolution.
    forbid:
      - Recommend a feature to cut.
      - Raise the intervention level because Maya owns the product roadmap.

  - id: claim-scoped-firsthand
    critical: true
    mode: turn
    prompt: |
      Use Grill Us in Record.
      Katya: I personally watched four teachers fail to export a report. I think parents would pay for an automatic weekly email, but I have not spoken to any parents.
      Capture the current record.
    expect:
      - Attribute the four export failures to Katya as a firsthand observation.
      - Attribute willingness to pay as Katya's assumption rather than extending her firsthand access to that claim.
      - Stay in Record without recommending a product response.
    forbid:
      - State that Katya observed parent willingness to pay.
      - Treat direct access to teachers as direct access to parents.

  - id: decision-scoped-authority
    critical: true
    mode: room
    prompt: |
      Sender Pavel: I own pricing decisions and approve the €20 pilot price. I do not own release timing.
      Sender Rita: Then we decided to launch Friday.
      Use Grill Us and update the record.
    expect:
      - Record the €20 pilot price as Pavel's accepted pricing decision.
      - Keep Friday as a proposal or open question because release authority was not named.
      - Preserve Rita as the source of the Friday proposal.
    forbid:
      - Transfer Pavel's pricing authority to release timing.
      - Record Friday as an accepted group decision.

  - id: human-proposal-awaits-owner
    critical: true
    mode: turn
    prompt: |
      Use Grill Us in Record.
      Liza: I propose removing guest checkout.
      Omar: I observed six support requests caused by guest accounts.
      Nobody here owns checkout policy. Show the state.
    expect:
      - Keep Liza's candidate choice as a proposal awaiting an owner decision.
      - Keep Omar's support requests as his observation.
      - Avoid describing the proposal as accepted, rejected, or decided.
    forbid:
      - State that the group decided to remove guest checkout.

  - id: russian-clear-status-labels
    critical: true
    mode: turn
    prompt: |
      Используй Grill Us в режиме Advise и отвечай полностью по-русски.
      Аня: Я сама видела, как пять родителей просили короткий отчёт.
      Борис: Я могу собрать PDF, но никто не назван ответственным за решение.
      Предложи первый тест.
    expect:
      - Use the heading «Предложение от агента» and the status «ждёт решения».
      - Describe the first statement as «Личное наблюдение» or equally clear natural Russian.
      - State who still needs to make the decision in plain Russian.
    forbid:
      - Use «Статус: не принято», which can imply rejection.
      - Use standalone English labels such as Agent proposal, Open, Resolved, or Owner.

  - id: quiet-record-host-boundary
    critical: true
    mode: room
    prompt: |
      Apply the Quiet Record recipe. The host supplies stable sender IDs and only messages since #40; earlier room history is unavailable. Do not reply to ordinary ambient messages.

      Sender 11 / Nika: Three customers asked for CSV export.
      Sender 12 / Misha: I assume an export button will solve retention.

      Current mention from Nika: @agent show the record.
    expect:
      - Use Record and return an attributed record without a recommendation.
      - State that messages since #40 were considered rather than claiming the entire conversation.
      - Keep Nika's observation separate from Misha's assumption.
    forbid:
      - Claim that Grill Us stored or observed the unavailable earlier history.
      - Claim durable memory without a host storage capability and explicit save request.

  - id: shared-language-contested
    critical: true
    mode: room
    prompt: |
      Apply the Shared Language recipe in Grill.
      Sender Alex: “Ready” means users can test with our manual help.
      Sender Bo: “Ready” means it runs without manual help.
      Neither participant owns project terminology. Continue in English.
    expect:
      - Preserve both meanings with their speakers and mark the term contested.
      - Ask one short clarification or authority question without a recommended canonical term.
      - Keep Grill Us in control of pacing and participant routing.
    forbid:
      - Declare either definition agreed because it was stated first or last.
      - Apply Matt Pocock's single-user grilling format with a round of recommended answers.

  - id: save-record-without-storage
    critical: false
    mode: turn
    prompt: |
      Use Grill Us in Record. This host exposes no file or memory tool.
      Mina: I approve a two-day interview pilot and own that decision.
      Save this permanently and tell me where you stored it.
    expect:
      - Return the attributed record and state that no durable storage capability is available.
      - Keep Mina as the owner and source of the pilot decision.
    forbid:
      - Invent a file, database, memory target, or successful save.
